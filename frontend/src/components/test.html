<!DOCTYPE html>

    <title>Tabs Hover Effect</title>

    <style>
        .bs-tabs .typ-tab-box {
            position: relative;
        }

        /* TAB SPACING */
        .bs-tabs .typ-tab-box.orange-tab {
            margin-top: -255px;
            position: relative;
        }

        .bs-tabs .typ-tab-box.green-tab {
            margin-top: -235px;
            position: relative;
        }

        .bs-tabs .typ-tab-box.blue-tab {
            margin-top: -235px;
            position: relative;
        }

        .bs-tabs .typ-tab-box.purple-tab {
            margin-top: 0px;
            position: relative;
        }

        /* IMAGE WRAPPER */
        .bs-tabs .typ-tab-box .img-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            z-index: 5;
        }

        /* =========================
   DASHBOARD WRAPPERS
========================= */

        .bs-tabs .typ-tab-box .dashboard-wrapper {
            position: absolute;
            bottom: -40px;

            opacity: 0;
            visibility: hidden;

            transition: all 0.7s ease;

            transform-origin: bottom center;
        }

        /* CARD 1 */
        .bs-tabs .typ-tab-box .dashboard-wrapper:nth-child(2) {
            right: 80px;
            z-index: 1;
            transform: translateY(260px);
        }

        /* CARD 2 */
        .bs-tabs .typ-tab-box .dashboard-wrapper:nth-child(3) {
            right: 60px;
            z-index: 2;
            transform: translateY(220px);
        }

        /* CARD 3 */
        .bs-tabs .typ-tab-box .dashboard-wrapper:nth-child(4) {
            right: 40px;
            z-index: 3;
            transform: translateY(180px);
        }

        /* CARD 4 */
        .bs-tabs .typ-tab-box .dashboard-wrapper:nth-child(5) {
            right: 20px;
            z-index: 4;
            transform: translateY(140px);
        }

        /* DASHBOARD IMAGE */
        .bs-tabs .typ-tab-box .dashboard-wrapper .dashboard-img {
            width: 430px;
            display: block;
            border-radius: 22px;
        }

        /* =========================
   SHOW EFFECT
========================= */

        .bs-tabs .typ-tab-box:has(.flx-items p:hover) .dashboard-wrapper {
            opacity: 1;
            visibility: visible;
        }

        /* CARD 1 */
        .bs-tabs .typ-tab-box:has(.flx-items p:hover) .dashboard-wrapper:nth-child(2) {
            transform: translateY(-40px);
        }

        /* CARD 2 */
        .bs-tabs .typ-tab-box:has(.flx-items p:hover) .dashboard-wrapper:nth-child(3) {
            transform: translateY(-60px);
        }

        /* CARD 3 */
        .bs-tabs .typ-tab-box:has(.flx-items p:hover) .dashboard-wrapper:nth-child(4) {
            transform: translateY(-80px);
        }

        /* CARD 4 */
        .bs-tabs .typ-tab-box:has(.flx-items p:hover) .dashboard-wrapper:nth-child(5) {
            transform: translateY(-100px);
        }

        /* DEFAULT HEADING COLORS */
        .typ-purple {
            color: #6357ab;
        }

        .typ-orange {
            color: #cb491c;
        }

        .typ-green {
            color: #007276;
        }

        .typ-blue {
            color: #3f4afe;
        }

        /* TAGS */
        .bs-tabs .typ-tab-box .flx-items p {
            padding: 10px 18px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.35s ease;
            font-size: 15px;
            font-weight: 500;
        }

        /* PURPLE TAG */
        .purple-name {
            background: #d3e4ff;
            color: #3f4afe;
        }

        .purple-name:hover {
            background: #2c08b5;
            color: #fff;
            transform: translateY(-2px);
        }

        /* ORANGE TAG */

    </style>
